<style>
    body {
        background: linear-gradient(135deg, #0a2342 60%, #ffd700 100%);
        min-height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form-container {
        background: #142850;
        padding: 2rem 1.5rem;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(10, 35, 66, 0.2);
        max-width: 350px;
        width: 100%;
        color: #ffd700;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .form-container label {
        font-weight: 600;
        color: #ffd700;
        margin-bottom: 0.3rem;
    }

    .form-container input,
    .form-container select {
        padding: 0.7rem;
        border: 1px solid #ffd700;
        border-radius: 8px;
        background: #0a2342;
        color: #ffd700;
        font-size: 1rem;
        margin-bottom: 0.7rem;
        outline: none;
        transition: border 0.2s;
    }

    .form-container input:focus,
    .form-container select:focus {
        border: 2px solid #ffd700;
        background: #142850;
    }

    .form-container button {
        background: linear-gradient(90deg, #ffd700 60%, #f7c948 100%);
        color: #142850;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        padding: 0.9rem;
        font-size: 1.1rem;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(10, 35, 66, 0.1);
        transition: background 0.2s, color 0.2s;
    }

    .form-container button:hover {
        background: #142850;
        color: #ffd700;
        border: 2px solid #ffd700;
    }

    @media (max-width: 500px) {
        .form-container {
            padding: 1rem 0.5rem;
            max-width: 95vw;
        }

        .form-container button {
            font-size: 1rem;
            padding: 0.7rem;
        }
    }
</style>
<form method="POST" class="form-container">
    <h2 style="color:#ffd700;text-align:center;">Add Watchman</h2>
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required>
    <label for="username">Username:</label>
    <input type="text" name="username" id="username" required>
    <label for="password">Password:</label>
    <input type="password" name="password" id="password" required>
    <button type="submit">Add Watchman</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        {% with messages = get_flashed_messages(with_categories = true) %}
        {% if messages %}
        {% for category, message in messages %}
        Swal.fire({
            icon: "{{ 'success' if category == 'success' else ('error' if category == 'danger' else 'info') }}",
            title: "{{ category|capitalize }}",
            text: "{{ message }}",
            confirmButtonText: "OK"
        });
        {% endfor %}
        {% endif %}
        {% endwith %}
    });
</script>
