<!DOCTYPE html>
<html>

<head>
    <title>Manage Departments</title>
    <style>
        body {
            background: #0a2342;
            color: #ffd700;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #142850;
            border-radius: 10px;
            box-shadow: 0 0 10px #0003;
            padding: 30px;
        }

        h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ffd700;
            border-radius: 5px;
            background: #0a2342;
            color: #ffd700;
        }

        button {
            background: #ffd700;
            color: #142850;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #e6c200;
        }

        h3 {
            color: #ffd700;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #23395d;
            color: #ffd700;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 5px;
        }

        a {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
            background: #23395d;
            padding: 10px 0;
            border-radius: 5px;
            transition: background 0.2s;
        }

        a:hover {
            background: #ffd700;
            color: #142850;
        }


    </style>
</head>

<body>
    <div class="container">
        <h2>Manage Departments</h2>
        <form method="POST">
            <input type="text" name="department_name" placeholder="Enter new department name" required>
            <button type="submit">Add Department</button>
        </form>
        <h3>Existing Departments</h3>
        <ul>
            {% for dept in departments %}
            <li>
                {{ dept.name }}
                <a href="{{ url_for('delete_department', department_id=dept.id) }}" class="delete-icon"
                    title="Delete Department"
                    onclick="return confirm('Are you sure you want to delete this department?');">
                    <i class="fas fa-trash-alt"></i>
                </a>
            </li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('warden_dashboard') }}">Back to Dashboard</a>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            {% with messages = get_flashed_messages(with_categories = true) %}
            {% if messages %}
            {% for category, message in messages %}
            Swal.fire({
                icon: "{{ 'success' if category == 'success' else ('error' if category == 'danger' else 'info') }}",
                title: "{{ category|capitalize }}",
                text: "{{ message }}",
                confirmButtonText: "OK"
            });
            {% endfor %}
            {% endif %}
            {% endwith %}
        });
    </script>

    
</body>

</html>
