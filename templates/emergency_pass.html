<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Pass</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d3d5e 0%, #1b2733 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container */
        .emergency-pass-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        /* Header */
        .emergency-pass-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .emergency-pass-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .emergency-pass-header p {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .emergency-pass-header:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
        }

        /* Content */
        .emergency-pass-content {
            padding: 30px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #dc3545;
            background: white;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Time Inputs */
        .time-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-inputs select {
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .ampm-info {
            display: block;
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        /* Button Container */
        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Emergency Notice */
        .emergency-notice {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .emergency-notice h3 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .emergency-notice p {
            color: #856404;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .emergency-pass-container {
                margin: 10px;
                max-width: 100%;
            }
            
            .emergency-pass-header {
                padding: 20px;
            }
            
            .emergency-pass-header h1 {
                font-size: 24px;
                flex-direction: column;
                gap: 8px;
            }
            
            .emergency-pass-content {
                padding: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .time-inputs {
                flex-direction: column;
                align-items: stretch;
            }
            
            .time-inputs select {
                min-width: auto;
            }
            
            .submit-btn {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
            }
        }

        /* Animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .emergency-pass-header {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Custom select arrow */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c757d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }

        /* Placeholder color */
        ::placeholder {
            color: #adb5bd;
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: #adb5bd;
        }

        ::-ms-input-placeholder {
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="emergency-pass-container">
        <div class="emergency-pass-header">
            <h1><i class="fas fa-exclamation-triangle"></i> Emergency Pass Request</h1>
            <p>For urgent outpass requests requiring immediate attention</p>
        </div>

        <div class="emergency-pass-content">
            <form method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="roll_number"><i class="fas fa-id-card"></i> Roll Number:</label>
                        <input type="text" id="roll_number" name="roll_number" required placeholder="Enter your roll number">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="department"><i class="fas fa-building"></i> Department:</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            {% for dept in departments %}
                            <option value="{{ dept.name }}" {% if student and student.department==dept.name %}selected{% endif %}>
                                {{ dept.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="room_number"><i class="fas fa-door-open"></i> Room Number:</label>
                        <input type="text" id="room_number" name="room_number" required placeholder="Enter your room number">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="out_date"><i class="fas fa-calendar-day"></i> Out Date:</label>
                        <input type="date" id="out_date" name="out_date" required>
                    </div>

                    <div class="form-group">
                        <label for="in_date"><i class="fas fa-calendar-check"></i> In Date:</label>
                        <input type="date" id="in_date" name="in_date" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Out Time:</label>
                        <div class="time-inputs">
                            <select class="outhour" id="out-hour" name="out-hour">
                                {% for hour in range(1, 13) %}
                                    <option value="{{ "%02d"|format(hour) }}">{{ "%02d"|format(hour) }}</option>
                                {% endfor %}
                            </select>
                            :
                            <select class="outminute" id="out-minute" name="out-minute">
                                {% for minute in range(0, 60, 5) %}
                                    <option value="{{ "%02d"|format(minute) }}">{{ "%02d"|format(minute) }}</option>
                                {% endfor %}
                            </select>
                            <select class="outampm" id="out-am-pm" name="out-am-pm">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                        <span class="ampm-info">Night 12 to Morning 12 is AM, Morning 12 to Night 12 is PM</span>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> In Time:</label>
                        <div class="time-inputs">
                            <select class="inhour" id="in-hour" name="in-hour">
                                {% for hour in range(1, 13) %}
                                    <option value="{{ "%02d"|format(hour) }}">{{ "%02d"|format(hour) }}</option>
                                {% endfor %}
                            </select>
                            :
                            <select class="inminute" id="in-minute" name="in-minute">
                                {% for minute in range(0, 60, 5) %}
                                    <option value="{{ "%02d"|format(minute) }}">{{ "%02d"|format(minute) }}</option>
                                {% endfor %}
                            </select>
                            <select class="inampm" id="in-am-pm" name="in-am-pm">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                        <span class="ampm-info">Night 12 to Morning 12 is AM, Morning 12 to Night 12 is PM</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="student_category"><i class="fas fa-users"></i> Student Category:</label>
                    <select id="student_category" name="student_category" required>
                        <option value="sports">Sports</option>
                        <option value="hostel">Hostel</option>
                        <option value="international">International</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason"><i class="fas fa-comment"></i> Reason:</label>
                    <textarea id="reason" name="reason" required placeholder="Please provide a detailed reason for your emergency pass request"></textarea>
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i> Submit Emergency Pass
                    </button>
                </div>
            </form>
        </div>

        <div class="emergency-notice">
            <h3><i class="fas fa-exclamation-circle"></i> Important Notice</h3>
            <p>Emergency passes are for urgent situations only.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Set minimum date for out_date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('out_date').setAttribute('min', today);
            document.getElementById('in_date').setAttribute('min', today);
            
            // Set in_date to tomorrow by default
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('in_date').value = tomorrow.toISOString().split('T')[0];
            
            // Set current time as default for out time
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // Convert 0 to 12
            minutes = Math.ceil(minutes / 5) * 5; // Round to nearest 5 minutes
            
            if (minutes === 60) {
                minutes = 0;
                hours = (hours % 12) + 1;
                if (hours === 13) hours = 1;
            }
            
            document.getElementById('out-hour').value = hours.toString().padStart(2, '0');
            document.getElementById('out-minute').value = minutes.toString().padStart(2, '0');
            document.getElementById('out-am-pm').value = ampm;
            
            // Set in time to 2 hours later by default
            let inHours = (hours + 2) % 12;
            inHours = inHours ? inHours : 12;
            document.getElementById('in-hour').value = inHours.toString().padStart(2, '0');
            document.getElementById('in-minute').value = minutes.toString().padStart(2, '0');
            document.getElementById('in-am-pm').value = ampm;
            
            {% with messages = get_flashed_messages(with_categories = true) %}
            {% if messages %}
            {% for category, message in messages %}
            Swal.fire({
                icon: "{{ 'success' if category == 'success' else ('error' if category == 'danger' else 'info') }}",
                title: "{{ category|capitalize }}",
                text: "{{ message }}",
                confirmButtonText: "OK",
                background: "#fff",
                color: "#333",
                confirmButtonColor: "#dc3545"
            });
            {% endfor %}
            {% endif %}
            {% endwith %}
        });
    </script>
</body>
</html>
