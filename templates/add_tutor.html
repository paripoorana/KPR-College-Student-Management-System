{% extends "base.html" %}
{% block content %}

<center>
    <h2 style="color:#102B5C; margin: 15px 0; font-weight: 700;">Add New Tutor</h2>
</center>

<!-- ✅ Internal CSS -->
<style>
    /* ✅ Page Background */
    body {
        background-color: #f8f9fc;
        font-family: "Poppins", sans-serif;
    }

    /* ✅ Back Button (Top-Left) */
    .top-back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        background-color: #f1f5f9;
        color: #2563eb;
        padding: 8px 15px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid #dbeafe;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
    }

    .top-back-btn:hover {
        background-color: #e0ecff;
        transform: scale(1.05);
    }

    .top-back-btn span {
        font-size: 18px;
        margin-right: 6px;
    }

    /* ✅ Centered Form Container */
    form {
        max-width: 600px;
        margin: 20px auto;
        background-color: #fff;
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        border: 1px solid #e5e7eb;
    }

    /* ✅ Form Title */
    h2 {
        font-size: 24px;
        margin-bottom: 15px;
    }

    /* ✅ Form Groups */
    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #102B5C;
        font-size: 15px;
    }

    /* ✅ Input & Select Styling */
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        background-color: #fff;
        color: #111827;
        outline: none;
        transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
    }

    /* ✅ Submit Button */
    .submit-button {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: #fff;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 5px;
    }

    .submit-button:hover {
        background-color: #1e40af;
        transform: scale(1.02);
    }

    /* ✅ Responsive */
    @media screen and (max-width: 768px) {
        form {
            width: 90%;
            padding: 20px;
        }

        .submit-button,
        .top-back-btn {
            font-size: 14px;
            padding: 10px;
        }
    }
</style>

<!-- ✅ Back Button -->
<a href="{{ url_for('warden_tutors') }}" class="top-back-btn">
    <span>⬅</span> Back
</a>

<!-- ✅ Add Tutor Form -->
<form method="POST" action="{{ url_for('add_tutor') }}">
    <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="department">Department:</label>
        <select name="department_id" required>
            <option value="">Select Department</option>
            {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" class="submit-button">Add Tutor</button>
</form>

<!-- ✅ SweetAlert Flash Messages -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        {% with messages = get_flashed_messages(with_categories = true) %}
        {% if messages %}
        {% for category, message in messages %}
        Swal.fire({
            icon: "{{ 'success' if category == 'success' else ('error' if category == 'danger' else 'info') }}",
            title: "{{ category|capitalize }}",
            text: "{{ message }}",
            confirmButtonText: "OK"
        });
        {% endfor %}
        {% endif %}
        {% endwith %}
    });
</script>

{% endblock %}
